name: Bug report
description: Report a problem with openai-image
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste API keys, tokens, or `.env` contents.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. MCP client and config (secrets removed)
        2. Tool call
        3. Result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.14.0"
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Cursor
        - Claude Desktop
        - Claude Code
        - Codex
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The tool error JSON is useful. Delete any `sk-` key first.
      render: text
