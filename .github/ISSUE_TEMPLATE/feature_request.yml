name: Feature request
description: Suggest a change to openai-image
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The server stays a stdio MCP wrapper around OpenAI image generation and editing.
        Do not include API keys in this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool or docs do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
