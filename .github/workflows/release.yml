name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Canonical repo for the action previously published as google-github-actions/release-please-action.
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted Publishing requires npm >= 11.5.1. Node 22 still ships npm 10.
      # No registry-url and no NODE_AUTH_TOKEN: npm 11 uses the GitHub OIDC token.
      - name: Install npm 11
        run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
